<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admiralty height trial</title>
  </head>
  <body>
    <div id="map"></div>
    <aside>
      <h1>Admiralty height trial</h1>
      <p>
        EXPERIMENT · captured routes 26 Sep 2026 + live city mesh. Not navigation or surveyed
        validation.
      </p>
      <label
        >Height interpretation
        <select id="height">
          <option value="0">Raw Z as ellipsoidal height</option>
          <option value="-2.618">HKPD hypothesis: Z − 2.618 m locally</option>
          <option value="5">Stress test: Z + 5 m</option>
        </select></label
      ><label
        >Extra offset (m)
        <input id="offset" type="number" value="0" min="-50" max="50" step="0.25" /></label
      ><label><input id="xray" type="checkbox" /> Hide city to inspect underground geometry</label
      ><button id="frame">Frame route</button><button id="entrance">Inspect Exit E1</button
      ><button id="sample">Sample mesh at entrance points</button>
      <p id="status">Loading model…</p>
      <pre id="results"></pre>
      <p>
        Teal route; pink = route obscured by model. Samples may be roofs/canopies, not the walking
        surface. Map from Lands Department.
      </p>
    </aside>
    <script type="module" src="/experiments/admiralty-height.ts"></script>
  </body>
</html>
