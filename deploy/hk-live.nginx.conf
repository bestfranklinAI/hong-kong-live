server {
    listen 127.0.0.1:8080;
    server_name _;
    root /var/www/hk-live;
    index index.html;
    location /api/ {
        # No trailing slash: preserve the upstream /api path.
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 90s;
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(js|css|json|wasm|png|jpg|jpeg|svg|woff|woff2|gif|ico)$ {
        try_files $uri =404;
        expires 1h;
    }
}
